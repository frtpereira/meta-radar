<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Meta Radar</title>
  <desc>Logo mark combining a Poke Ball silhouette with radar sweep rings and contact blips.</desc>
  <defs>
    <clipPath id="ballClip">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6f6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2f6f6b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#ballClip)">
    <circle cx="100" cy="100" r="90" fill="#f7f7f5"/>
    <path d="M10,100 A90,90 0 0 1 190,100 Z" fill="#e0393e"/>
    <rect x="6" y="93" width="188" height="14" fill="#1d1d1d"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#2f6f6b" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.35"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#2f6f6b" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.4"/>
  </g>

  <circle cx="100" cy="100" r="90" fill="none" stroke="#1d1d1d" stroke-width="5"/>

  <circle cx="130" cy="65" r="9" fill="none" stroke="#2f6f6b" stroke-width="1.5" opacity="0.6"/>
  <circle cx="130" cy="65" r="4" fill="#1d1d1d"/>
  <circle cx="68" cy="138" r="3.5" fill="#2f6f6b"/>

  <circle cx="100" cy="100" r="28" fill="#f7f7f5" stroke="#1d1d1d" stroke-width="5"/>
  <circle cx="100" cy="100" r="16" fill="none" stroke="#2f6f6b" stroke-width="2.5"/>
  <path d="M100,100 L100,84 A16,16 0 0 1 111.3,88.7 Z" fill="url(#sweepGrad)"/>
  <circle cx="100" cy="100" r="3" fill="#1d3f3d"/>
</svg>
