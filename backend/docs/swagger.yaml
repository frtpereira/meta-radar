basePath: /
definitions:
  apidocs.ArchetypeDetail:
    properties:
      core_cards:
        items:
          $ref: '#/definitions/models.Card'
        type: array
      core_computed_at:
        type: string
      core_threshold:
        type: number
      id:
        type: integer
      meta_id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  apidocs.ArchetypeRef:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  apidocs.ArchetypeStat:
    properties:
      avg_standing:
        type: number
      deck_count:
        type: integer
      drop_count:
        type: integer
      id:
        type: integer
      losses:
        type: integer
      matches:
        type: integer
      name:
        type: string
      score_rate:
        type: number
      slug:
        type: string
      ties:
        type: integer
      win_rate:
        type: number
      wins:
        type: integer
    type: object
  apidocs.CardStat:
    properties:
      category:
        type: string
      count_distribution:
        additionalProperties:
          format: float64
          type: number
        type: object
      deck_count:
        type: integer
      is_core:
        type: boolean
      modal_count:
        type: integer
      name:
        type: string
      number:
        type: string
      presence:
        type: number
      set:
        type: string
      total_decklists:
        type: integer
    type: object
  apidocs.DecklistDetail:
    properties:
      archetype_id:
        type: integer
      archetype_name:
        type: string
      archetype_slug:
        type: string
      cards:
        items:
          $ref: '#/definitions/models.Card'
        type: array
      date:
        type: string
      id:
        type: integer
      player_id:
        type: string
      player_name:
        type: string
      tournament_id:
        type: string
      tournament_name:
        type: string
    type: object
  apidocs.MatchupStat:
    properties:
      archetype:
        $ref: '#/definitions/apidocs.ArchetypeRef'
      losses:
        type: integer
      matches:
        type: integer
      opponent:
        $ref: '#/definitions/apidocs.ArchetypeRef'
      score_rate:
        type: number
      ties:
        type: integer
      win_rate:
        type: number
      wins:
        type: integer
    type: object
  apidocs.PlayerDetail:
    properties:
      history:
        items:
          $ref: '#/definitions/apidocs.PlayerHistoryRow'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  apidocs.PlayerHistoryRow:
    properties:
      archetype_id:
        type: integer
      archetype_name:
        type: string
      archetype_slug:
        type: string
      date:
        type: string
      decklist_id:
        type: integer
      event_name:
        type: string
      placement:
        type: integer
      players:
        type: integer
      tournament_id:
        type: string
    type: object
  apidocs.StandingRow:
    properties:
      archetype_id:
        type: integer
      archetype_name:
        type: string
      archetype_slug:
        type: string
      decklist_id:
        type: integer
      losses:
        type: integer
      player_id:
        type: string
      player_name:
        type: string
      standing:
        type: integer
      ties:
        type: integer
      wins:
        type: integer
    type: object
  apidocs.TournamentDetail:
    properties:
      date:
        type: string
      format_code:
        type: string
      game:
        type: string
      has_decklists:
        type: boolean
      id:
        type: integer
      is_online:
        type: boolean
      meta_id:
        type: string
      meta_name:
        type: string
      name:
        type: string
      organizer_name:
        type: string
      players:
        type: integer
      standings:
        items:
          $ref: '#/definitions/apidocs.StandingRow'
        type: array
    type: object
  apidocs.TournamentsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Tournament'
        type: array
      next_page:
        type: integer
      next_url:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      prev_page:
        type: integer
      prev_url:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  apidocs.Variant:
    properties:
      avg_standing:
        type: number
      core_hash:
        type: string
      deck_count:
        type: integer
      drop_count:
        type: integer
      sample_decklist_id:
        type: integer
    type: object
  models.Card:
    properties:
      category:
        description: '"pokemon" | "trainer" | "energy"'
        type: string
      count:
        type: integer
      name:
        type: string
      number:
        type: string
      set:
        type: string
    type: object
  models.Meta:
    properties:
      ends_at:
        type: string
      format_code:
        type: string
      id:
        type: string
      name:
        type: string
      starts_at:
        type: string
    type: object
  models.Tournament:
    properties:
      date:
        type: string
      format_code:
        type: string
      game:
        type: string
      has_decklists:
        type: boolean
      id:
        type: string
      is_online:
        type: boolean
      meta_id:
        type: string
      meta_name:
        type: string
      name:
        type: string
      organizer_name:
        type: string
      players:
        type: integer
      winner_archetype:
        type: string
    type: object
info:
  contact: {}
  description: API for tracking Pokemon TCG tournaments, decklists, archetypes and
    matchup statistics.
  title: Meta Radar API
  version: "1.0"
paths:
  /api/archetypes/{id}:
    get:
      description: Returns an archetype's metadata plus its computed core card list.
      parameters:
      - description: Archetype ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidocs.ArchetypeDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get archetype detail
      tags:
      - archetypes
  /api/archetypes/{id}/card-stats:
    get:
      description: Returns per-card usage statistics (presence rate, copy-count distribution,
        modal count) for every decklist in an archetype.
      parameters:
      - description: Archetype ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidocs.CardStat'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Archetype card stats
      tags:
      - archetypes
  /api/archetypes/{id}/variants:
    get:
      description: Groups an archetype's decklists by core_hash into distinct build
        variants. Requires cmd/cluster to have run.
      parameters:
      - description: Archetype ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidocs.Variant'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List archetype variants
      tags:
      - archetypes
  /api/archetypes/stats:
    get:
      description: Returns per-archetype play counts, average standing, and win/score
        rates for a given meta.
      parameters:
      - description: Meta UUID
        in: query
        name: meta_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidocs.ArchetypeStat'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Archetype stats for a meta
      tags:
      - archetypes
  /api/decklists/{id}:
    get:
      description: Returns a single decklist's cards plus its player, tournament,
        and archetype context.
      parameters:
      - description: Decklist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidocs.DecklistDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get decklist detail
      tags:
      - decklists
  /api/matchups/stats:
    get:
      description: Returns directional archetype-vs-archetype matchup results for
        a meta. Not paginated -- matchups_mv rows for one meta are bounded by archetype-pair
        count, small enough for the frontend to sort/paginate client-side.
      parameters:
      - description: Meta UUID
        in: query
        name: meta_id
        required: true
        type: string
      - description: Minimum number of matches required to include a matchup (default
          20)
        in: query
        name: min_matches
        type: integer
      - description: Filter to matchups involving this archetype ID
        in: query
        name: archetype_id
        type: string
      - description: Include mirror matchups (default true)
        in: query
        name: include_mirrors
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apidocs.MatchupStat'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Archetype matchup stats
      tags:
      - matchups
  /api/metas:
    get:
      description: Lists all known metas (format eras) ordered by start date descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Meta'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List metas
      tags:
      - metas
  /api/players/{nickname}:
    get:
      description: Looks up a player by nickname and returns their tournament history
        (placement, event, date, players, archetype, decklist).
      parameters:
      - description: Player nickname
        in: path
        name: nickname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidocs.PlayerDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get player detail
      tags:
      - players
  /api/tournaments:
    get:
      description: Lists tournaments, optionally filtered by minimum player count,
        format, meta, and event name, and sorted by date, players, or winner archetype.
      parameters:
      - description: Minimum number of players
        in: query
        name: min_players
        type: integer
      - description: Format code (e.g. STANDARD)
        in: query
        name: format
        type: string
      - description: Meta UUID to filter by
        in: query
        name: meta_id
        type: string
      - description: Case-insensitive substring match on the tournament name
        in: query
        name: event_name
        type: string
      - description: 'Sort column: date, players, or winner_archetype (default date)'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: asc or desc (default desc)'
        in: query
        name: sort_dir
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size, max 100 (default 20)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidocs.TournamentsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List tournaments
      tags:
      - tournaments
  /api/tournaments/{id}:
    get:
      description: Returns a tournament's metadata plus its full standings (player,
        archetype, match record).
      parameters:
      - description: Tournament ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidocs.TournamentDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get tournament detail
      tags:
      - tournaments
  /api/webhooks/limitless:
    post:
      consumes:
      - application/json
      description: Receives tournament update events from Limitless TCG and triggers
        an async sync of the affected tournament.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Limitless tournament webhook
      tags:
      - webhooks
  /health:
    get:
      description: Reports whether the API is up.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
swagger: "2.0"
