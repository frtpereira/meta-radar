services:
    postgres:
        image: postgres:16-alpine
        container_name: tcg_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-pokemontcg}
            POSTGRES_USER: ${DB_USER:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./db/migrations:/docker-entrypoint-initdb.d:ro
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-pokemontcg}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s

    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: tcg_api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-pokemontcg}?sslmode=disable
            PORT: 8080
            LIMITLESS_API_BASE: https://play.limitlesstcg.com/api
            LIMITLESS_API_KEY: ${LIMITLESS_API_KEY:-}
            WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
        ports:
            - "8080:8080"

    ingest:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: tcg_ingest
        restart: unless-stopped
        entrypoint: ["ingest"]
        command: ["--interval=15m"]
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-pokemontcg}?sslmode=disable
            LIMITLESS_API_BASE: https://play.limitlesstcg.com/api
            LIMITLESS_API_KEY: ${LIMITLESS_API_KEY:-}

    snapshot-scheduler:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: tcg_snapshot_scheduler
        restart: unless-stopped
        entrypoint: ["snapshot"]
        # Runs daily at 06:00 UTC, plus a weekly snapshot every Monday --
        # see backend/cmd/snapshot's package comment. Override with
        # SNAPSHOT_AT (e.g. "SNAPSHOT_AT=09:30" in .env) if 6am UTC isn't
        # what you want; it's always UTC regardless of the host's clock.
        command: ["--daemon", "--at=${SNAPSHOT_AT:-06:00}"]
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-pokemontcg}?sslmode=disable

volumes:
    pgdata:
